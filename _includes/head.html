<meta charset="utf-8">

{% include seo.html %}

{% unless site.atom_feed.hide %}
<link href="{% if site.atom_feed.path %}{{ site.atom_feed.path }}{% else %}{{ '/feed.xml' | relative_url }}{% endif %}"
  type="application/atom+xml" rel="alternate" title="{{ site.title }} Feed">
{% endunless %}

<!-- https://t.co/dKP3o1e -->
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script>
  document.documentElement.className = document.documentElement.className.replace(/\bno-js\b/g, '') + ' js ';
</script>

<!-- For all browsers -->
<!-- Critical CSS to prevent layout shift / flicker on navigation -->
<style>
  .author__avatar {
    display: table-cell;
    vertical-align: top;
    width: 36px;
    height: 36px;
  }

  .author__avatar img {
    max-width: 200px;
    border-radius: 0%;
  }

  @media (min-width: 64em) {
    .author__avatar {
      display: block;
      width: auto;
      height: auto;
    }
  }
</style>
<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}" id="theme-style">
<script>
  (function () {
    const savedTheme = localStorage.getItem('theme') || 'system';
    const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    let shouldBeDark = false;

    if (savedTheme === 'dark') {
      shouldBeDark = true;
    } else if (savedTheme === 'system' && systemDark) {
      shouldBeDark = true;
    }

    if (shouldBeDark) {
      document.getElementById('theme-style').href = '{{ "/assets/css/dark.css" | relative_url }}';
    }
  })();
</script>
<link rel="preload" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@5/css/all.min.css" as="style"
  onload="this.onload=null;this.rel='stylesheet'">
<noscript>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@5/css/all.min.css">
</noscript>

{% if site.head_scripts %}
{% for script in site.head_scripts %}
<script src="{{ script | relative_url }}"></script>
{% endfor %}
{% endif %}
