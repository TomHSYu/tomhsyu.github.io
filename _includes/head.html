<meta charset="utf-8">

{% include seo.html %}

{% unless site.atom_feed.hide %}
<link href="{% if site.atom_feed.path %}{{ site.atom_feed.path }}{% else %}{{ '/feed.xml' | relative_url }}{% endif %}"
  type="application/atom+xml" rel="alternate" title="{{ site.title }} Feed">
{% endunless %}

<!-- https://t.co/dKP3o1e -->
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script>
  document.documentElement.className = document.documentElement.className.replace(/\bno-js\b/g, '') + ' js ';
</script>

<!-- For all browsers -->
<!-- Critical CSS to prevent FOUC (Flash of Unstyled Content) -->
<script>
  (function () {
    var savedTheme = localStorage.getItem('theme') || 'system';
    var systemDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    var shouldBeDark = (savedTheme === 'dark') || (savedTheme === 'system' && systemDark);

    if (shouldBeDark) {
      document.documentElement.style.background = '#252a34';
      document.documentElement.classList.add('dark');
    }
    // Store for later use by the stylesheet link
    window.__shouldBeDark = shouldBeDark;
  })();
</script>
<style>
  /* Hide skip-links to prevent them from flashing as visible text */
  .skip-links {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
  }

  .screen-reader-shortcut {
    position: absolute;
    overflow: hidden;
    clip: rect(0 0 0 0);
    width: 1px;
    height: 1px;
    margin: -1px;
    padding: 0;
    border: 0;
  }

  /* Avatar styles to prevent image flash */
  .author__avatar {
    display: table-cell;
    vertical-align: top;
    width: 36px;
    height: 36px;
  }

  .author__avatar img {
    max-width: 200px;
    border-radius: 0%;
  }

  @media (min-width: 64em) {
    .author__avatar {
      display: block;
      width: auto;
      height: auto;
    }
  }

  /* Navigation styles to prevent hamburger menu flash */
  .greedy-nav {
    display: flex;
    align-items: center;
    min-height: 2.4em;
  }

  .greedy-nav__toggle.hidden {
    display: none;
  }

  .hidden-links.hidden {
    display: none;
  }

  .visible-links {
    display: flex;
    justify-content: flex-end;
    flex: 1;
    overflow: hidden;
  }

  .visible-links li {
    flex: none;
    list-style: none;
  }

  .masthead__menu-item {
    display: block;
    list-style-type: none;
    white-space: nowrap;
  }
</style>
<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}" id="theme-style">
<script>
  (function () {
    if (window.__shouldBeDark) {
      document.getElementById('theme-style').href = '{{ "/assets/css/dark.css" | relative_url }}';
    }
  })();
</script>
<link rel="preload" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@5/css/all.min.css" as="style"
  onload="this.onload=null;this.rel='stylesheet'">
<noscript>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@5/css/all.min.css">
</noscript>

{% if site.head_scripts %}
{% for script in site.head_scripts %}
<script src="{{ script | relative_url }}"></script>
{% endfor %}
{% endif %}
